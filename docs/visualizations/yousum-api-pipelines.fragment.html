    function renderSteps(flow) {
      const ol=root.querySelector('.steps');const mobile=root.querySelector('.mobile-route');ol.replaceChildren();mobile.replaceChildren();
      flow.steps.forEach((step,index)=>{
        const li=document.createElement('li');li.className='step';li.dataset.phase=step.phase;
        const num=document.createElement('span');num.className='step-index text-small';num.textContent=String(index+1).padStart(2,'0');
        const actor=document.createElement('span');actor.className='step-actor text-small';actor.textContent=step.actor;
        const content=document.createElement('div');content.className='step-content';const code=document.createElement('code');code.textContent=step.fn;const note=document.createElement('span');note.className='step-note text-small';note.textContent=step.note;let symbol=code;if(step.source){symbol=document.createElement('a');symbol.href=step.source;symbol.target='_blank';symbol.rel='noreferrer';symbol.append(code);}content.append(symbol,note);
        const tx=document.createElement('span');tx.className='step-tx text-small';tx.textContent=step.tx;
        li.append(num,actor,content,tx);ol.append(li);
        const row=document.createElement('div');row.className='route-row';row.dataset.phase=flow.future||flow.planned?'pending':step.phase;
        const arrow=document.createElement('span');arrow.className='route-arrow';arrow.textContent=index===flow.steps.length-1?'└':'↓';
        const body=document.createElement('div');body.className='route-content';const heading=document.createElement('span');heading.textContent=step.actor+' · '+step.tx;const fn=document.createElement('code');fn.textContent=step.fn;let symbolMobile=fn;if(step.source){symbolMobile=document.createElement('a');symbolMobile.href=step.source;symbolMobile.target='_blank';symbolMobile.rel='noreferrer';symbolMobile.append(fn);}const label=document.createElement('span');label.className='text-small';label.textContent=step.note;body.append(heading,symbolMobile,label);row.append(arrow,body);mobile.append(row);
      });
      const active=phasesFor(flow);const other=document.createElement('div');other.className='mobile-other text-small';other.textContent='이 경로에 참여하지 않음: '+Object.keys(labels).filter(k=>!active.has(k)&&k!=='app').map(k=>labels[k]).join(' · ');mobile.append(other);
    }
    function render() {
      const a=selected(),f=flows[a.id];
      root.querySelector('.method').textContent=a.method;
      root.querySelector('.endpoint-path').textContent=a.path;
      root.querySelector('.scope').textContent=a.id+' · '+(f.readOnly?'구현 · 저장 데이터 조회':f.local?'구현 · 로컬 DB':f.implemented?'구현 · 실제 외부 연동 대기':f.future?'운영 후속 · 설계':'후속 이슈 · 설계');
      const commits=root.querySelector('.commits');commits.replaceChildren();
      for(const sha of f.commits||[]){const link=document.createElement('a');link.href=repo+'/commit/'+sha;link.target='_blank';link.rel='noreferrer';link.textContent=sha;commits.append(link);}
      root.querySelector('.source').href=a.source;
      root.querySelector('.input').textContent=f.input;
      root.querySelector('.output').textContent=f.output;
      root.querySelector('.boundary').textContent=f.boundary;
      root.dataset.apiId=a.id;root.dataset.implemented=String(!!f.implemented);renderSteps(f);draw();
    }
    function restore(saved) {
      const id=saved&&saved.privateContent&&saved.privateContent.apiId;
      if(catalog.some(a=>a.id===id))state.apiId=id;
    }
    function persist() {
      if(window.openai&&window.openai.setWidgetState)window.openai.setWidgetState({modelContent:{apiId:state.apiId,method:selected().method,path:selected().path},privateContent:{apiId:state.apiId}}).catch(()=>{});
    }
    domainSelect.addEventListener('change',()=>{state.apiId=catalog.find(a=>a.domain===domainSelect.value).id;selectOptions();render();persist();});
    apiSelect.addEventListener('change',()=>{state.apiId=apiSelect.value;render();persist();});
    restore(window.openai&&window.openai.widgetState);selectOptions();render();
    window.addEventListener('openai:set_globals',event=>{const saved=event.detail&&event.detail.globals&&event.detail.globals.widgetState;if(saved){restore(saved);selectOptions();render();}});
    new ResizeObserver(draw).observe(root);
  })();
  </script>
</div>
