server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
    }

    location = /itip-demo.apk {
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition 'attachment; filename="itip-demo.apk"';
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
