name: 기능 요청
description: 새 기능의 목적, 구현 범위와 완료 조건을 정리합니다.
title: 'feat: '
body:
  - type: input
    id: owner
    attributes:
      label: 담당자
      description: GitHub 아이디를 적고 이슈의 Assignees에도 지정해주세요.
      placeholder: '@github-id'
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 어떤 문제를 해결하며, 사용자가 무엇을 할 수 있게 되나요?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 구현할 API, 로직, DB 변경 등을 적어주세요.
      placeholder: |
        - [ ] 구현 작업
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 동작과 테스트 결과로 확인할 수 있는 조건을 적어주세요.
      placeholder: |
        - [ ] 기대 동작 및 검증 조건
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 API 명세, 기획 문서, 이슈 링크를 적어주세요. 인증정보와 실제 사용자 데이터는 포함하지 마세요.
