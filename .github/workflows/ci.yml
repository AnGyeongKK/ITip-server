name: Backend CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ITip

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: itip_ci
          POSTGRES_USER: itip_ci
          # Disposable CI database only; this is not a production credential.
          POSTGRES_PASSWORD: itip_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itip_ci -d itip_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            ITip/**/*.gradle
            ITip/gradle/wrapper/gradle-wrapper.properties

      - name: Build and test
        run: ./gradlew --no-daemon --stacktrace build
        env:
          SPRING_PROFILES_ACTIVE: ci
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/itip_ci
          SPRING_DATASOURCE_USERNAME: itip_ci
          SPRING_DATASOURCE_PASSWORD: itip_ci

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ITip/**/build/reports/tests/
            ITip/**/build/test-results/test/
          if-no-files-found: ignore
          retention-days: 7
