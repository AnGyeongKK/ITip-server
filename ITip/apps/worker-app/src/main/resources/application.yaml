server:
  port: ${WORKER_PORT:8081}
spring:
  config:
    import: [classpath:domain.yaml, classpath:ai-embedding.yaml]
  application:
    name: itip-worker
  flyway:
    enabled: false

logging:
  level:
    # 빈 choices 응답에서 SDK 모델이 전체 prompt를 WARN으로 기록하는 경로를 차단한다.
    "org.springframework.ai.openai.OpenAiChatModel": "OFF"

itip:
  analysis:
    generation:
      enabled: ${ANALYSIS_OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${ANALYSIS_OPENAI_MODEL:}
      token-encoding: ${ANALYSIS_TOKEN_ENCODING:}
      context-tokens: ${ANALYSIS_CONTEXT_TOKENS:0}
      input-token-budget: ${ANALYSIS_INPUT_TOKEN_BUDGET:30000}
      total-output-tokens: ${ANALYSIS_TOTAL_OUTPUT_TOKENS:16000}
      plan-output-tokens: ${ANALYSIS_PLAN_OUTPUT_TOKENS:1024}
      detail-output-tokens: ${ANALYSIS_DETAIL_OUTPUT_TOKENS:4096}
      summary-output-tokens: ${ANALYSIS_SUMMARY_OUTPUT_TOKENS:3072}
      detail-concurrency: ${ANALYSIS_DETAIL_CONCURRENCY:3}
  push:
    enabled: ${FCM_PUSH_ENABLED:false}
    project-id: ${FCM_PROJECT_ID:}
  worker:
    scheduling-enabled: ${WORKER_SCHEDULING_ENABLED:true}
    poll-delay: ${WORKER_POLL_DELAY:PT2S}
    lease-duration: ${WORKER_LEASE_DURATION:PT2M}
    heartbeat-delay: ${WORKER_HEARTBEAT_DELAY:PT20S}
    retry-delay: ${WORKER_RETRY_DELAY:PT5S}
    chunk-code-points: ${WORKER_CHUNK_CODE_POINTS:1200}
